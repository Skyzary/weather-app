name: CI.yml
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install

      - name: Run tests
        run: npm run test
        env:
          VITE_API_KEY: "test-weather-key"
          VITE_UNSPLASH_ACCESS_KEY: "test-unsplash-key"

      - name: Run linter
        run: npm run lint

  registry:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Calculate version
        id: calc_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${VERSION}.${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/weather-app:${{ steps.calc_version.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/weather-app:latest
